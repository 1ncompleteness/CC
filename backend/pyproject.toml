[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "contextcleanse"
version = "1.0.0"
description = "Advanced email classification system with machine learning and AI-powered context analysis"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Development Team", email = "dev@contextcleanse.com"}
]
keywords = ["email", "classification", "machine-learning", "spam-detection", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Email :: Filters",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "scikit-learn==1.9.0",
    "xgboost==3.4.1",
    "numpy==2.5.2",
    "pandas==3.0.5",
    "scipy==1.18.1",
    "joblib==1.5.3",
    "asyncpg==0.31.0",
    "sqlalchemy[asyncio]==2.0.52",
    "alembic==1.19.1",
    "python-jose[cryptography]==3.5.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.32",
    "PyJWT==2.13.0",
    "authlib==1.7.2",
    "httpx==0.28.1",
    "requests==2.34.2",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "loguru==0.7.3",
    "onnxruntime==1.29.0",
    "redis==8.1.0",
    "email-validator==2.3.0",
    "psycopg2-binary==2.9.12",
    "sentence-transformers==6.0.1",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers==5.16.1",
    "pgvector==0.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.isort]
profile = "black"
line_length = 100 